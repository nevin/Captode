<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captode — Step-by-step guide</title>
<link rel="icon" href="../icons/icon32.png">
<script src="../lib/theme.js"></script>
<link rel="stylesheet" href="../lib/ui.css">
<style>
  body { background: var(--stage); min-height: 100vh; }
  .topbar .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .topbar .translate { width: auto; height: 32px; }
  main { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
  .title { width: 100%; font-size: 22px; font-weight: 650; height: 44px; margin-bottom: 4px; }
  .muted { color: var(--muted); }
  .lead { margin: 0 0 20px; font-size: 13px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
  .step { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow-sm); }
  .step .head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; }
  .step .n { flex: none; display: grid; place-items: center; width: 28px; height: 28px; margin-top: 4px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px; }
  .step textarea { flex: 1; min-height: 38px; resize: vertical; font: inherit; }
  .step img { display: block; width: 100%; height: auto; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--stage); }
  .step .tools { display: flex; flex-direction: column; gap: 4px; }
  .empty, .loading { text-align: center; padding: 48px 16px; }
  @media (max-width: 640px) { .topbar { flex-wrap: wrap; height: auto; padding-block: 8px; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="../icons/icon48.png" alt="">Captode</div>
  <div class="sep"></div>
  <div class="doc"><b data-i18n="guide_heading">Step-by-step guide</b></div>
  <div class="spacer"></div>
  <div class="actions">
    <select id="translate" class="translate hidden" aria-label="Translate into" data-i18n-aria-label="translate_into"></select>
    <button class="btn" id="copy" disabled data-tip="Every step with its picture, to paste into Google Docs, Notion, Confluence or an email" data-i18n-tip="guide_copy_tip" data-i18n="editor_copy">Copy</button>
    <button class="btn" id="dl-page" disabled data-tip="One web page with every step; opens in any browser" data-i18n-tip="guide_page_tip" data-i18n="guide_download_page">Web page</button>
    <button class="btn" id="dl-pdf" disabled data-i18n="guide_download_pdf">PDF</button>
    <button class="btn" id="dl-md" disabled data-tip="A zip with a Markdown file and the pictures, for docs and wikis" data-i18n-tip="guide_markdown_tip" data-i18n="guide_download_markdown">Markdown</button>
  </div>
</header>
<main>
  <input type="text" class="title" id="title" aria-label="Title" data-i18n-aria-label="guide_title_label">
  <p class="lead muted" data-i18n="guide_lead">A step for each click in the recording. Edit the notes, remove steps you don't need, then download.</p>
  <p class="loading muted" id="loading" data-i18n="guide_loading">Making the steps…</p>
  <p class="empty muted hidden" id="empty" data-i18n="guide_empty">This recording has no clicks to make steps from. Record a tab and click as you go.</p>
  <ol id="steps"></ol>
</main>
<script type="module" src="guide.js"></script>
</body>
</html>
