name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (downloads Chrome for Testing)
        run: npm ci
      - name: Firefox, for testing the Firefox package
        shell: bash
        run: echo "FIREFOX_PATH=$(npx puppeteer browsers install firefox@stable | tail -1 | cut -d' ' -f2-)" >> "$GITHUB_ENV"
      - name: Tests
        run: npm test
      # Fonts and rendering differ between machines, so CI reports the numbers
      # rather than comparing them with baselines recorded elsewhere.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test/output/
          if-no-files-found: ignore
      - name: Compression benchmark
        run: npm run bench -- --report
      - name: Package
        run: npm run package
      - name: Firefox package passes Mozilla's validator
        run: npm run lint:firefox
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: captode-extension
          path: dist/*.zip
