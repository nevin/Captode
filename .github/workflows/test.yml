name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (downloads Chrome for Testing)
        run: npm ci
      - name: Tests
        run: npm test
      - name: Compression benchmark
        run: npm run bench
      - name: Package
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: captode-extension
          path: dist/*.zip
