<!doctype html>
<meta charset="utf-8">
<title>Colour chart</title>
<style>
  body { margin: 0; background: #fff; }
  .grid { display: grid; grid-template-columns: repeat(4, 160px); gap: 0; padding: 20px; }
  .grid div { height: 100px; }
</style>
<!-- Brand and UI colours, primaries, and greys: captures and exports must keep them exact. -->
<div class="grid" id="grid"></div>
<script>
  window.COLOURS = ['#6c56ff', '#e5484d', '#ffb224', '#30a46c', '#ff0000', '#00ff00', '#0000ff', '#00b8d9',
    '#1e1e1e', '#808080', '#f5f5f5', '#c9a227', '#0f62fe', '#ff6b9a', '#4a3aa8', '#e8f5e9'];
  for (const c of COLOURS) { const d = document.createElement('div'); d.style.background = c; grid.append(d); }
</script>
